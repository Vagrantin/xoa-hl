# XOA-HL Patch Metadata
# =====================
# This file describes all patches applied to the upstream xen-orchestra
# source to create XOA-HL (HomeLab Edition).
#
# Structure:
# - Each patch has a unique `id` (filename without .patch extension)
# - `description` explains the purpose of the patch
# - `target` is the upstream file/path being modified
# - `upstream_commit` is the commit SHA this patch was created against
# - `applies_to` is a list of upstream versions this patch is valid for
# - `maintainer` is the contact for this patch
# - `status` can be: active, deprecated, superseded
# - `dependencies` lists other patch IDs this patch requires
#
# When adding a new patch:
# 1. Add the .patch file to this directory
# 2. Add its metadata entry below
# 3. The build script will validate and apply it in dependency order

