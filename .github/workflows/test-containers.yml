name: Check dedicated Docker VM management
on:
  pull_request:
    paths: ['patches/**', 'tests/test-container*', 'SPECS/xoa-hl.spec', '.github/workflows/test-containers.yml']
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply complete patch series to the pinned XO source
        run: |
          set -euo pipefail
          . ./UPSTREAM_XO
          git init "$RUNNER_TEMP/xo-containers"
          git -C "$RUNNER_TEMP/xo-containers" remote add origin https://github.com/vatesfr/xen-orchestra.git
          git -C "$RUNNER_TEMP/xo-containers" fetch --depth 1 origin "$XO_COMMIT"
          git -C "$RUNNER_TEMP/xo-containers" checkout FETCH_HEAD
          for patch in patches/*.patch; do git -C "$RUNNER_TEMP/xo-containers" apply "$GITHUB_WORKSPACE/$patch"; done
      - name: Test keys, transport, deployment and API authorization
        run: node tests/test-containers.mjs "$RUNNER_TEMP/xo-containers"
      - name: Install isolated UI test dependencies
        run: npm install --prefix "$RUNNER_TEMP/container-test-deps" --ignore-scripts @babel/core@7.28.4 @babel/plugin-transform-react-jsx@7.27.1 @babel/plugin-proposal-decorators@7.28.0 @babel/plugin-transform-class-properties@7.27.1 react@15.7.0 react-test-renderer@15.6.2
      - name: Test actual container UI with the pinned React generation
        env:
          CONTAINER_TEST_DEPS: ${{ runner.temp }}/container-test-deps
        run: node tests/test-container-ui.cjs "$RUNNER_TEMP/xo-containers"
