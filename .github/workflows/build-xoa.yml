name: Build xoa-hl

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build in AlmaLinux 9 container
        run: |
          docker build -t xoa-hl-builder -f container/Containerfile container/
          docker run --rm \
            -v ${{ github.workspace }}/patches:/build/patches \
            -v ${{ github.workspace }}/out:/build/out \
            -v ${{ github.workspace }}/scripts:/build/scripts \
            xoa-hl-builder bash /build/scripts/build-xo.sh

      - name: Read version
        id: vers
        run: |
          version=$(cat out/VERSION)
          echo "version=${version//-/_}" >> "$GITHUB_OUTPUT"

      - name: Rename the xoa-hl tar ball
        id: xoname
        run: |
          filename="out/xoa-hl-${{ steps.vers.outputs.version }}.tar.gz"
          newmane=$(echo $filename | rev | sed 's/-/_/' | rev)
          mv "$filename" "$newname"
          echo "newname=$newname" >> "$GITHUB_OUTPUT"

      - name: Update version for RPM compatibility
        id: ver
        run: |
          version=$(cat out/VERSION)
          echo "version=${version//-/_}" >> "$GITHUB_OUTPUT"


      - name: Build RPM
        run: |
          docker run --rm -v ${{ github.workspace }}:/build/repo xoa-hl-builder bash -c "
            rpmbuild --define '_version ${{ steps.ver.outputs.version }}' \
                      --define '_sourcedir /build/repo/SOURCES' \
                      --define '_rpmdir /build/repo/out' \
                      -bb /build/repo/SPECS/xoa-hl.spec
          "
      - name: List build outputs
        run: find /build/repo/out out -type f 2>/dev/null || echo "no files found"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: |
            out/${{ steps.xoaname.outputs.newmane }}
            out/noarch/xoa-hl-${{ steps.ver.outputs.version }}-1.*.noarch.rpm
