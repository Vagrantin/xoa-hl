name: Build xoa-hl
run-name: "Build xoa-hl (Tag: ${{ github.ref_name }})"

on:
  push:
    tags:
      - 'v*-ce[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Emergency release tag'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Generates a clean safety fallback tag if run via orchestrator dispatch
      - name: Derive release tag
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.release_tag }}" ]; then
              TAG="${{ github.event.inputs.release_tag }}"
            else
              TAG="v-ce-automated-$(date +'%Y%m%d%H%M')-run${{ github.run_number }}"
            fi
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "Target release tag established as: ${TAG}"

      # A parse error in a build script aborts the whole job after the
      # container and upstream checkout are already done. Catch it up front.
      - name: Check shell script syntax
        run: |
          set -euo pipefail
          for s in scripts/*.sh; do
            echo "  bash -n $s"
            bash -n "$s"
          done
          # SOURCES/*.sh are #!/bin/sh and ship inside the RPM, so a syntax
          # error in one of them only shows up on an appliance. sh is dash on
          # the runner, which also rejects the bashisms they must not use.
          for s in SOURCES/*.sh; do
            echo "  sh -n $s"
            sh -n "$s"
          done

      - name: Build in AlmaLinux 9 container
        run: |
          docker build -t xoa-hl-builder -f container/Containerfile container/
          docker run --rm \
            -v ${{ github.workspace }}/patches:/build/patches \
            -v ${{ github.workspace }}/out:/build/out \
            -v ${{ github.workspace }}/scripts:/build/scripts \
            -v ${{ github.workspace }}/UPSTREAM_XO:/build/UPSTREAM_XO:ro \
            xoa-hl-builder bash /build/scripts/build-xo.sh

      - name: Get version
        id: ver
        run: echo "version=$(cat out/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Stage sources for rpmbuild
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          # The tarball is now a build input, it is not published any more.
          cp "out/xoa-hl-${VERSION}.tar.gz" "SOURCES/xoa-hl-${VERSION}.tar.gz"

          # The tag's ce counter becomes the RPM Release, so every build has
          # a distinct, yum-upgradeable NEVRA.
          case "${RELEASE_TAG}" in
            *-ce[0-9]*) CE_COUNTER="${RELEASE_TAG##*-ce}" ;;
            *)          CE_COUNTER="0.${{ github.run_number }}" ;;  # automated fallback tag, sorts below any real ce release
          esac
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "CE_COUNTER=${CE_COUNTER}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}"   >> $GITHUB_ENV
          echo "RPM Version/Release: ${VERSION} / ${CE_COUNTER}.g${SHORT_SHA}.xcpng8.3"

      - name: Build RPM
        run: |
          docker run --rm -v ${{ github.workspace }}:/build/repo xoa-hl-builder bash -c "
            mkdir -p /root/rpmbuild/{BUILD,BUILDROOT,RPMS,SPECS,SRPMS}
            rpmbuild --define '_version ${{ steps.ver.outputs.version }}' \
                      --define '_release ${CE_COUNTER}' \
                      --define '_shortcommit ${SHORT_SHA}' \
                      --define '_sourcedir /build/repo/SOURCES' \
                      --define '_rpmdir /build/repo/out' \
                      -bb /build/repo/SPECS/xoa-hl.spec
          "

      - name: Locate built RPM
        run: |
          set -euo pipefail
          # Arch agnostic: rpmbuild writes out/<arch>/, x86_64 today.
          NEW_RPM=$(find out -name "xoa-hl-${{ steps.ver.outputs.version }}-*.rpm" | head -1)
          [ -n "${NEW_RPM}" ] || { echo "no RPM produced"; exit 1; }
          echo "new_rpm=${NEW_RPM}" >> $GITHUB_ENV
          ls -lh "${NEW_RPM}"

      - name: Check scriptlets and prepare signing
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          # The builder container writes out/ as root. The runner must own the
          # RPM for rpmsign and the directory for release-notes.sh.
          sudo chown -R "$(id -u):$(id -g)" out
          scripts=$(rpm -qp --scripts "${new_rpm}")
          echo "${scripts}"
          if grep -qE '^[[:space:]]*%' <<<"${scripts}"; then
            echo "Unexpanded RPM macro in scriptlets"; exit 1
          fi

      - name: Sign RPM
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" --import
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent
          echo "${GPG_PASSPHRASE}" | gpg --batch --pinentry-mode loopback \
            --passphrase-fd 0 --quiet --no-tty \
            -u "XCP-ng Community Edition" \
            --sign --output /dev/null /dev/null
          cat > ~/.rpmmacros <<'EOF'
          %_gpg_name XCP-ng Community Edition
          %__gpg_sign_cmd %{__gpg} gpg --batch --no-verbose --no-armor \
            --no-secmem-warning --pinentry-mode loopback \
            -u "%{_gpg_name}" -sbo %{__signature_filename} \
            --digest-algo sha256 %{__plaintext_filename}
          EOF
          rpmsign --addsign "${new_rpm}"

      - name: Verify RPM signature
        run: |
          set -euo pipefail
          rpm --import "$GITHUB_WORKSPACE/xcp-ng-ce-public.asc"
          result=$(rpm --checksig "${new_rpm}")
          echo "${result}"
          grep -Fq "digests signatures OK" <<<"${result}" || {
            echo "RPM signature verification failed"; exit 1;
          }

      - name: Prepare release notes
        run: scripts/release-notes.sh "$RELEASE_TAG" '${{ steps.ver.outputs.version }}' "$new_rpm" out/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          # A candidate (xcp-hl#179): only the testing channel serves it until prod/promote moves it to stable.
          prerelease: true
          generate_release_notes: true
          body_path: out/release-notes.md
          files: ${{ env.new_rpm }}
