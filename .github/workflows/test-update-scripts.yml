name: Test update scripts

on:
  pull_request:
    paths:
      - 'SOURCES/xoa-hl-*.sh'
      - 'SOURCES/xoa-hl-*.service'
      - 'SOURCES/xoa-hl-*.timer'
      - 'SPECS/xoa-hl.spec'
      - 'tests/*.sh'
      - 'tests/*.py'
      - 'SOURCES/*.py'
      - '.github/workflows/test-update-scripts.yml'
  push:
    branches:
      - main
    paths:
      - 'SOURCES/xoa-hl-*.sh'
      - 'SOURCES/xoa-hl-*.service'
      - 'SOURCES/xoa-hl-*.timer'
      - 'SPECS/xoa-hl.spec'
      - 'tests/*.sh'
      - 'tests/*.py'
      - 'SOURCES/*.py'
      - '.github/workflows/test-update-scripts.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX shell syntax
        run: |
          set -eu
          for script in SOURCES/*.sh tests/*.sh; do
            sh -n "$script"
          done
      - name: Test update scripts
        run: sh tests/test-update-scripts.sh
      - name: Test update history
        run: python3 tests/test-update-history.py
      - name: Test guest identity publication
        run: python3 tests/test-publish-identity.py
      - name: Validate timer calendars
        run: |
          systemd-analyze calendar '*-*-* 03:00:00'
          systemd-analyze calendar 'Sun *-*-* 03:00:00'
